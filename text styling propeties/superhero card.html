<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: rgb(125, 162, 112);
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 50px;
            font-weight: bold;
            font-style: italic;
            text-shadow: 5px 5px yellow
        }
        .para1{
            color: blue;
            font-weight: bold;
            font-size: 20px;
            text-transform: capitalize;

        }
        .h2{
            text-transform: uppercase;
            color: brown;
            font-size: 20px;
            text-decoration: underline;

        }
        .h3{
            color: rgb(127, 127, 79);
            transform: rotate(15deg);
            
        }
    </style>
</head>
<body>
    <h1>
        Thunder kids

    </h1>
    <p class="para1">
        the most powerful hero in the school

    </p>
    <h2 class="h2">
        super powers

    </h2>
    <h3 class="h3">
        tophero
    </h3>
</body>
</html>
